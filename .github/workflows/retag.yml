name: Move release tags

# One-off: points each release tag at its commit after the author fix. Deleted after it runs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          while read -r tag sha; do
            git cat-file -e "$sha^{commit}"
            git tag -f "$tag" "$sha"
          done <<'LIST'
          v0.1.0 fdbfdc9230d7
          v0.1.1 53e606f31856
          v0.1.2 fad51bdffa4e
          v0.1.3 b6cf3b2a751b
          v0.2.0 ea7d6c22f1d4
          v0.2.1 7340babddcfe
          v0.2.2 04f73dd34d26
          v0.2.3 c86e11c99d5f
          v0.2.4 3bc31824ca36
          v0.3.0 8341798ee52a
          v0.3.1 22ff7260b7b1
          v0.4.0 166b87993684
          v0.4.1 47c4d7da350a
          LIST
          git push --force origin --tags
