name: Move release tags

# One-off: points each release tag at its rewritten commit. Deleted after it runs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          while read -r tag sha; do
            git cat-file -e "$sha^{commit}"
            git tag -f "$tag" "$sha"
          done <<'EOF'
          v0.1.0 1d7408d047b1
          v0.1.1 941373d9ea87
          v0.1.2 411cbe6caa65
          v0.1.3 ba1945bc16fb
          v0.2.0 5889df90d068
          v0.2.1 a94fd3dcc4ee
          v0.2.2 2df0dc72a6e9
          v0.2.3 1f3d092e124a
          v0.2.4 afb255e1810a
          v0.3.0 7f48758c5082
          v0.3.1 914bda96ee20
          v0.4.0 c05fd773bcc5
          EOF
          git push --force origin --tags
          git log --no-walk --format='%h %an %s' $(git tag)
